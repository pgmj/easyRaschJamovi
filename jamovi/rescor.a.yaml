---
name: rescor
title: Residual Correlations
menuGroup: easyRaschJamovi
version: '1.0.0'
jas: '1.2'

description:
    main: |
        NOTE: this function takes some time to complete the simulations and produce output. 
        Test with few (50) iterations, and use at least 500 (max 1000) 
        for publication ready results.

options:
    - name: data
      type: Data

    - name: vars
      title: Items
      type: Variables
      suggested:
          - continuous
          - nominal
          - ordinal
      permitted:
          - numeric

    - name: iterations
      title: Iterations
      type: Integer
      min: 50
      max: 1000
      default: 150
      description:
        R: Test with few (50) iterations first.
        jamovi: Test with few (50) iterations, and use at least 500 (max 1000) for publication ready results.

    - name: cores
      title: CPU Cores
      type: Integer
      min: 1
      max: 16
      default: 4

    - name: seed
      title: Random Seed
      type: Integer
      default: 1234

...
