---
name: itemfit
title: Item Fit Analysis
menuGroup: easyRaschJamovi
version: '1.0.0'
jas: '1.2'

description:
    main: |
        NOTE: this function takes some time to complete the simulations and produce output. 
        Test with few (100) iterations, and see <https://pgmj.github.io/rasch_itemfit/> for
        suggestions on appropriate iterations for your sample size.

options:
    - name: data
      type: Data

    - name: vars
      title: Items
      type: Variables
      suggested:
          - continuous
          - nominal
          - ordinal
      permitted:
          - numeric

    - name: iterations
      title: Iterations
      type: Integer
      min: 50
      max: 1000
      default: 150
      description:
        jamovi: Test with few (100) iterations, and see <https://pgmj.github.io/rasch_itemfit/> for
        suggestions on appropriate iterations for your sample size

    - name: cores
      title: CPU Cores
      type: Integer
      min: 1
      max: 16
      default: 4

    - name: seed
      title: Random Seed
      type: Integer
      default: 1234

...
